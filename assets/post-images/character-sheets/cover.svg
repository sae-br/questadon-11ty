<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3.2" fill="#A20041" opacity="0.55"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ED1E79" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#ED1E79" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1600" fill="#0c180e"/>
  <rect width="1200" height="1600" fill="url(#dots)" opacity="0.35"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- inner keyline -->
  <rect x="56" y="56" width="1088" height="1488" fill="none" stroke="#A20041" stroke-width="3" rx="14"/>

  <!-- top eyebrow -->
  <text x="600" y="188" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, sans-serif"
        font-size="34" font-weight="600" letter-spacing="14" fill="#ED1E79">QUESTADON</text>
  <line x1="480" y1="222" x2="720" y2="222" stroke="#ED1E79" stroke-width="2" opacity="0.7"/>

  <!-- emblem: character sheet + d20 -->
  <g transform="translate(600,760)">
    <!-- sheet -->
    <rect x="-230" y="-290" width="460" height="570" rx="18"
          fill="none" stroke="#E6FF7C" stroke-width="9"/>

    <!-- name field + level box -->
    <g fill="none" stroke="#E6FF7C" stroke-width="7" opacity="0.55">
      <rect x="-180" y="-240" width="240" height="50" rx="8"/>
      <rect x="88"   y="-240" width="92"  height="50" rx="8"/>
    </g>

    <!-- ability scores: a stacked column, the shape a sheet actually has -->
    <g fill="none" stroke="#E6FF7C" stroke-width="7">
      <rect x="-180" y="-160" width="96" height="104" rx="12"/>
      <rect x="-180" y="-44"  width="96" height="104" rx="12"/>
      <rect x="-180" y="72"   width="96" height="104" rx="12"/>
    </g>
    <g stroke="#E6FF7C" stroke-width="6" stroke-linecap="round" opacity="0.5">
      <line x1="-158" y1="-108" x2="-106" y2="-108"/>
      <line x1="-158" y1="8"    x2="-106" y2="8"/>
      <line x1="-158" y1="124"  x2="-106" y2="124"/>
    </g>

    <!-- filled-in lines beside them -->
    <g stroke="#E6FF7C" stroke-width="7" stroke-linecap="round" opacity="0.5">
      <line x1="-52" y1="-150" x2="180" y2="-150"/>
      <line x1="-52" y1="-100" x2="138" y2="-100"/>
      <line x1="-52" y1="-50"  x2="180" y2="-50"/>
      <line x1="-52" y1="0"    x2="120" y2="0"/>
      <line x1="-52" y1="50"   x2="172" y2="50"/>
      <line x1="-52" y1="100"  x2="142" y2="100"/>
    </g>
    <g stroke="#E6FF7C" stroke-width="7" stroke-linecap="round" opacity="0.5">
      <line x1="-180" y1="212" x2="180" y2="212"/>
      <line x1="-180" y1="250" x2="60"  y2="250"/>
    </g>

    <!-- d20, occluding the sheet corner -->
    <g transform="translate(196,232)">
      <polygon points="0,-118 102,-59 102,59 0,118 -102,59 -102,-59"
               fill="#0c180e" stroke="#ED1E79" stroke-width="17" stroke-linejoin="round"/>
      <polygon points="0,-59 51,30 -51,30"
               fill="none" stroke="#ED1E79" stroke-width="12" stroke-linejoin="round"/>
      <g stroke="#ED1E79" stroke-width="10" stroke-linecap="round" opacity="0.85">
        <line x1="0" y1="-59" x2="0" y2="-118"/>
        <line x1="51" y1="30" x2="102" y2="59"/>
        <line x1="-51" y1="30" x2="-102" y2="59"/>
      </g>
    </g>
  </g>

  <!-- title block -->
  <line x1="140" y1="1180" x2="1060" y2="1180" stroke="#A20041" stroke-width="3"/>
  <text x="600" y="1300" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, sans-serif"
        font-size="86" font-weight="700" fill="#E6FF7C">D&amp;D CHARACTER</text>
  <text x="600" y="1396" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, sans-serif"
        font-size="86" font-weight="700" fill="#E6FF7C">SHEETS</text>
  <text x="600" y="1478" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, sans-serif"
        font-size="42" font-weight="500" letter-spacing="6" fill="#FFA4C8">Simple. Digital. Free.</text>
</svg>
