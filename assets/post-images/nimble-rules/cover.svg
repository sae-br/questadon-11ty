<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3.2" fill="#A20041" opacity="0.55"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ED1E79" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#ED1E79" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1600" fill="#0c180e"/>
  <rect width="1200" height="1600" fill="url(#dots)" opacity="0.35"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- inner keyline -->
  <rect x="56" y="56" width="1088" height="1488" fill="none" stroke="#A20041" stroke-width="3" rx="14"/>

  <!-- top eyebrow -->
  <text x="600" y="188" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, sans-serif"
        font-size="34" font-weight="600" letter-spacing="14" fill="#ED1E79">QUESTADON</text>
  <line x1="480" y1="222" x2="720" y2="222" stroke="#ED1E79" stroke-width="2" opacity="0.7"/>

  <!-- emblem: stacked rulebook pages + magnifier -->
  <g transform="translate(600,760)">
    <g stroke="#E6FF7C" stroke-width="9" fill="none" stroke-linecap="round">
      <rect x="-210" y="-190" width="330" height="410" rx="16" opacity="0.30"/>
      <rect x="-240" y="-215" width="330" height="410" rx="16" opacity="0.60"/>
      <rect x="-270" y="-240" width="330" height="410" rx="16"/>
    </g>
    <g stroke="#E6FF7C" stroke-width="9" stroke-linecap="round" opacity="0.55">
      <line x1="-215" y1="-160" x2="-45" y2="-160"/>
      <line x1="-215" y1="-90"  x2="-10" y2="-90"/>
      <line x1="-215" y1="-20"  x2="-70" y2="-20"/>
    </g>
    <!-- magnifier -->
    <g stroke="#ED1E79" stroke-width="18" fill="#0c180e" stroke-linecap="round">
      <circle cx="90" cy="95" r="120"/>
      <line x1="178" y1="183" x2="272" y2="277"/>
    </g>
    <g stroke="#ED1E79" stroke-width="13" stroke-linecap="round" opacity="0.9">
      <line x1="30" y1="70" x2="150" y2="70"/>
      <line x1="30" y1="120" x2="112" y2="120"/>
    </g>
  </g>

  <!-- title block -->
  <line x1="140" y1="1180" x2="1060" y2="1180" stroke="#A20041" stroke-width="3"/>
  <text x="600" y="1300" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, sans-serif"
        font-size="86" font-weight="700" fill="#E6FF7C">RULE REFERENCE</text>
  <text x="600" y="1396" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, sans-serif"
        font-size="86" font-weight="700" fill="#E6FF7C">TOOL</text>
  <text x="600" y="1478" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, sans-serif"
        font-size="42" font-weight="500" letter-spacing="6" fill="#FFA4C8">for Nimble TTRPG</text>
</svg>
